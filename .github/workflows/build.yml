name: Build & Prepare to release

on:
    push:
        tags:
          - 'v[0-9]+.[0-9]+.[0-9]+'
    
    workflow_dispatch:

env:
    QT_VERSION: '6.11.*'
    BUILD_DIR: build

jobs:
    build-windows:
        name: Build for Windows
        runs-on: windows-2022
        
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
             
            - name: Install Qt
              uses: jurplel/install-qt-action@v4
              with:
                aqtsource: git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head
                version: ${{ env.QT_VERSION }}
                host: windows
                target: desktop
                arch: win64_llvm_mingw
                tools: 'tools_llvm_mingw1706 tools_ninja'
                set-env: true
                cache: true
                
            - name: Configure
              shell: pwsh
              run: |
                cmake `
                  -S . `
                  -B "${env:BUILD_DIR}" `
                  -G Ninja `
                  -DCMAKE_BUILD_TYPE=Release
            
            - name: Build
              shell: pwsh
              run: |
                cmake `
                  --build "${env:BUILD_DIR}" `
                  --config Release `
                  --parallel 2
                  
            - name: Package with CPack
              shell: pwsh
              working-directory: ${{ env.BUILD_DIR }}
              run: |
                cpack
            
            - name: Upload packages
              uses: actions/upload-artifact@v4
              with:
                name: tablica-znakowa-kontroler-${{ github.ref_name }}
                if-no-files-found: error
                path: |
                  build/tablica-znakowa-kontroler*.exe
                  build/tablica-znakowa-kontroler*.zip
                  build/tablica-znakowa-kontroler*.sha256
    
    build-android:
      name: Build Android arm64-v8a
      runs-on: ubuntu-26.04
      
      environment:
          name: android-release
      
      steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
              fetch-depth: 0
          
          - name: Read version
            id: version
            shell: bash
            run: |
              VERSION="$(tr -d '\r\n' < version.txt)"
          
          - name: Set up JDK
            uses: actions/setup-java@v5
            with:
              distribution: temurin
              java-version: '17'
          
          - name: Install Qt
            uses: jurplel/install-qt-action@v4
            with:
              aqtsource: git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head
              version: ${{ env.QT_VERSION }}
              host: all_os
              target: android
              arch: android_arm64_v8a
              set-env: true
              cache: true
          
          - name: Set up Android NDK for Qt
            uses: nttld/setup-ndk@v1
            id: ndk
            with:
               ndk-version: '27.2.12479018'
               
          - name: Decode Keystore
            id: decode_keystore
            uses: timheuer/base64-to-file@v2
            with:
              fileName: 'release_key.jks'
              encodedString: ${{ secrets.SIGNING_KEY }}
          
          - name: Configure
            env:
              QT_ANDROID_SIGN_APK: 'ON'
              QT_ANDROID_KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.filePath }}
              QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
              QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
              QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
              ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
            run: |
              cmake \
                -S . \
                -B build-android \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=arm64-v8a \
                -DQT_ANDROID_SIGN_APK=ON \
                -DQT_ANDROID_KEYSTORE_PATH="$QT_ANDROID_KEYSTORE_PATH" \
                -DQT_ANDROID_KEYSTORE_ALIAS="$QT_ANDROID_KEYSTORE_ALIAS" \
                -DQT_ANDROID_KEYSTORE_STORE_PASS="$QT_ANDROID_KEYSTORE_STORE_PASS" \
                -DQT_ANDROID_KEYSTORE_KEY_PASS="$QT_ANDROID_KEYSTORE_KEY_PASS"
                
          - name: Build APK
            run: cmake --build build-android --target apk --config Release --parallel 2
            
          - name: Rename APK
            run: |
              mkdir -p android-release
              
              cp \
                "$(find build-android -type f -name '*.apk' -print -quit)" \
                "android-release/tablica-znakowa-kontroler-${{ steps.version.outputs.version }}-Android-arm64-v8a-release-signed.apk"
          
          - name: Verify APK
            run: |
              APK="android-release/tablica-znakowa-kontroler-${{ steps.version.outputs.version }}-Android-arm64-v8a-release-signed.apk"
              
              apksigner verify --verbose --print-certs "$APK"
              
          - name: Upload Android package
            uses: actions/upload-artifact@v4
            with:
              name: tablica-znakowa-kontroler-${{ steps.version.outputs.version }}-Android-arm64-v8a-release-signed
              if-no-files-found: error
              path: |
                android-release/*.apk
    
    release:
      name: Create Draft Release
      runs-on: ubuntu-latest
      needs:
        - build-windows
        - build-android
      if: startsWith(github.ref, 'refs/tags/v')
      
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        
        - name: Generate changelog
          id: changelog
          uses: requarks/changelog-action@v1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            tag: ${{ github.ref_name }}
            writeToFile: false
            useGitmojis: false
            includeInvalidCommits: false
        
        - name: Download Windows artifacts
          uses: actions/download-artifact@v4
          with:
            name: tablica-znakowa-kontroler-${{ github.ref_name }}
            path: release-assets
            
        - name: Download Android artifacts
          uses: actions/download-artifact@v4
          with:
            pattern: tablica-znakowa-kontroler-*-Android-arm64-v8a-release-signed
            path: release-assets
            merge-multiple: true
        
        - name: Create draft release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.ref_name }}
            name: Release ${{ github.ref_name }}
            
            body: |
              ${{ steps.changelog.outputs.changelog }}
            draft: true
            prerelease: false
            
            files: |
              release-assets/tablica-znakowa-kontroler*.exe
              release-assets/tablica-znakowa-kontroler*.zip
              release-assets/tablica-znakowa-kontroler*.sha256
              release-assets/tablica-znakowa-kontroler*-Android-arm64-v8a-release-signed.apk